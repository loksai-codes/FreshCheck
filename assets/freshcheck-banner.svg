    <circle cx="157" cy="29" r="5" fill="#b2f1c1"/>
  </g>
  <text x="290" y="144" fill="#f2f6f2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="67" font-weight="750" letter-spacing="-3">FreshCheck</text>
  <text x="295" y="194" fill="#a8b8ac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="3.2">FRESHNESS INTELLIGENCE FOR AI ANSWERS</text>
