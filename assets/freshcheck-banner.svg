<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">FreshCheck</title>
  <desc id="desc">A freshness shield with a checkmark on a deep green gradient.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a15"/>
      <stop offset=".55" stop-color="#182b20"/>
      <stop offset="1" stop-color="#0b1210"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b2f1c1"/>
      <stop offset="1" stop-color="#56c979"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <circle cx="1000" cy="150" r="105" fill="#52c978" opacity=".16" filter="url(#glow)"/>
